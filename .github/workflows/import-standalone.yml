name: Import tested standalone project source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-standalone
  cancel-in-progress: false
jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import exact standalone project files
        run: |
          if [ -f PROJECT.json ]; then
            echo "Standalone project already imported. Avoid overwriting."
            exit 0
          fi
          git clone --depth 1 --branch standalone-multilingual-civic-services-navigator https://github.com/harshakavali81-collab/Enterprise-AI-Intelligence-Platform-Development.git "$RUNNER_TEMP/standalone-project"
          rsync -a --exclude '.git/' "$RUNNER_TEMP/standalone-project/" ./
          test -s PROJECT.json
          test -s README.md
          test -s app/main.py
          test -s frontend/index.html
          test -s assets/cover.svg
          test -s assets/architecture.svg
          test -s assets/synthetic-trend.svg
          test -s docs/workflow.mmd
          test -s docs/THREAT_MODEL.md
          test -s tests/test_demo.py
      - name: Test and compile standalone source
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
          python cli.py
          python -m compileall -q app
      - name: Publish source code, graphics, project structure, diagrams and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Avoid GitHub token's restricted creation of an additional workflow file.
          rm -f .github/workflows/ci.yml
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "feat: import complete tested standalone public-benefit AI project"
          git push origin HEAD:main
